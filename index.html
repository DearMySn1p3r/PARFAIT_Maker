<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parfait Maker</title>
<meta name="description" content="이름과 색으로, 또는 직접 골라서 나만의 파르페를 만들어요.">
<link rel="icon" type="image/png" href="MOMO.png">
<link rel="apple-touch-icon" href="MOMO.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#FFFFFF; --bg-img:none; --bg-size:auto;
    --surface:#FFFFFF; --ink:#161415; --mid:#6A6567; --soft:#A6A1A3;
    --bd:#EAE8E8; --bw:1px; --ctl-line:#E7E4E4; --line-2:#F2F0F0; --fill:#F6F5F5;
    --accent:#EE6E97; --accent-hover:#E35A87; --accent-ink:#C9467A; --accent-soft:#FDF0F4;
    --accent-2:#8CC9AE; --accent-3:#F5CE6E;
    --head:'Pretendard Variable',Pretendard,sans-serif; --head-w:900; --head-ls:-.05em; --h1:22px;
    --field-font:'Pretendard Variable',Pretendard,sans-serif; --field-w:700; --field-size:12px;
    --r:18px; --r-ctl:11px;
    --card-shadow:none; --btn-bd:transparent; --btn-shadow:none; --btn-r:11px;
    --save-bg:#161415;
    --stage:#F7F5F4;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background-color:var(--bg);background-image:var(--bg-img);background-size:var(--bg-size);background-attachment:fixed;
    color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    letter-spacing:-.012em;-webkit-font-smoothing:antialiased;min-height:100vh;
    transition:background-color .3s
  }
  button,select,input{font-family:inherit;color:inherit}
  svg{display:block}
  .app{max-width:1120px;margin:0 auto;padding:30px 20px 48px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .logo{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;transition:transform .35s cubic-bezier(.34,1.6,.5,1)}
  .logo svg{width:32px;height:32px}
  .logo:hover{transform:rotate(-8deg)}
  h1{font-family:var(--head);font-weight:var(--head-w);letter-spacing:var(--head-ls);font-size:var(--h1);margin:0;line-height:1.1}
  .brand p{margin:5px 0 0;font-size:13px;color:var(--mid)}
  .top-acts{display:flex;gap:6px;flex:0 0 auto}
  .ghost{
    width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--mid);
    display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s
  }
  .ghost svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ghost:hover{background:var(--fill);color:var(--ink)}
  .ghost[aria-pressed=false]{color:var(--soft)}
  h1::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:4px}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:0;align-items:stretch;margin-top:24px}
  .layout > .controls{border-radius:var(--r) 0 0 var(--r);border-right:0}
  .layout > #plate{border-radius:0 var(--r) var(--r) 0}
  @media (max-width:900px){
    .layout{grid-template-columns:minmax(0,1fr);gap:12px}
    .layout > .controls,.layout > #plate{border-radius:var(--r);border-right:var(--bw) solid var(--bd)}
  }
  .panel{background:var(--surface);border:var(--bw) solid var(--bd);border-radius:var(--r);padding:20px;box-shadow:var(--card-shadow)}
  .controls{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:thin}
  @media (max-width:900px){ .controls{position:static;max-height:none;overflow:visible} }

  .field{margin-top:22px}
  .field-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
  .field-h h2{margin:0;font-family:var(--field-font);font-weight:var(--field-w);font-size:var(--field-size);color:var(--mid)}
  .field-h > span{font-size:12px;color:var(--soft);display:inline-flex;align-items:center;gap:8px}

  /* ---------- inputs ---------- */
  .guest,.lrow{
    display:flex;align-items:center;gap:8px;height:46px;padding:0 5px 0 8px;
    border:1px solid var(--ctl-line);border-radius:var(--r-ctl);background:var(--surface);transition:border-color .15s
  }
  .guest + .guest,.lrow + .lrow{margin-top:7px}
  .guest:focus-within,.lrow:focus-within{border-color:var(--soft)}
  .csw{
    width:28px;height:28px;flex:0 0 auto;border:0;padding:0;border-radius:9px;cursor:pointer;background:var(--c);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .15s cubic-bezier(.34,1.6,.5,1)
  }
  .csw.sm{width:22px;height:22px;border-radius:7px}
  .csw:hover{transform:scale(1.1) rotate(-6deg)}
  .guest input,.lrow select{flex:1;min-width:0;border:0;background:transparent;font-size:14.5px;font-weight:600;padding:0;height:100%}
  .guest input:focus,.lrow select:focus{outline:0}
  .guest input::placeholder,.text-in::placeholder{color:var(--soft);font-weight:500}
  .lrow select{
    -webkit-appearance:none;appearance:none;cursor:pointer;padding-right:18px;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 4.5l3 3 3-3' fill='none' stroke='%23999' stroke-width='1.5' stroke-linecap='round'/></svg>") right 2px center/12px no-repeat
  }
  .lrow .no{font-size:11px;font-weight:700;color:var(--soft);width:16px;text-align:center;flex:0 0 auto}
  .text-in{
    width:100%;height:46px;border:1px solid var(--ctl-line);border-radius:var(--r-ctl);background:var(--surface);
    padding:0 14px;font-size:14.5px;font-weight:600
  }
  .text-in:focus{outline:0;border-color:var(--soft)}
  .icon-btn{
    width:30px;height:30px;flex:0 0 auto;border:0;background:transparent;border-radius:9px;cursor:pointer;
    color:var(--soft);display:grid;place-items:center;transition:background .15s,color .15s
  }
  .icon-btn:hover:not(:disabled){background:var(--fill);color:var(--ink)}
  .icon-btn:disabled{opacity:.3;cursor:default}
  .icon-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn[hidden]{display:none}
  .add-btn{
    margin-top:8px;width:100%;height:42px;border:1.5px dashed var(--ctl-line);border-radius:var(--r-ctl);background:transparent;
    color:var(--mid);font-size:13px;font-weight:700;cursor:pointer;transition:background .15s,color .15s,border-color .15s
  }
  .add-btn:hover:not(:disabled){background:var(--fill);color:var(--ink);border-color:var(--soft)}
  .add-btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- color popover ---------- */
  .pop{
    position:absolute;z-index:30;width:234px;background:var(--surface);border:var(--bw) solid var(--bd);border-radius:16px;
    padding:12px;box-shadow:0 18px 40px -14px rgba(0,0,0,.25);animation:popin .18s cubic-bezier(.34,1.6,.5,1)
  }
  .pop[hidden]{display:none}
  @keyframes popin{from{transform:scale(.92);opacity:0}}
  .pop__sw{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .sw{width:28px;height:28px;border-radius:9px;border:0;padding:0;cursor:pointer;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .12s}
  .sw:hover{transform:scale(1.12)}
  .sw[aria-pressed=true]{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
  .pop__custom{
    position:relative;display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:10px;
    background:var(--fill);font-size:12.5px;font-weight:600;color:var(--mid);cursor:pointer
  }
  .rainbow{width:16px;height:16px;border-radius:5px;background:conic-gradient(#F59AB8,#F8D27A,#A6DA9A,#86C4EE,#B9A0E6,#F59AB8)}
  .pop__custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}

  /* ---------- tiles ---------- */
  .glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .gtile,.top-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
    background:var(--surface);border:1px solid var(--ctl-line);border-radius:var(--r-ctl);padding:10px 4px 8px;
    transition:border-color .15s,background .15s,transform .15s cubic-bezier(.34,1.6,.5,1)
  }
  .gtile:hover,.top-btn:hover{transform:translateY(-2px)}
  .gtile svg{width:30px;height:38px}
  .gtile .gt{fill:none;stroke:var(--soft);stroke-width:9;stroke-linejoin:round}
  .gtile span,.top-btn span{font-size:12px;font-weight:600;color:var(--mid);white-space:nowrap}
  .gtile[aria-pressed=true],.top-btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
  .gtile[aria-pressed=true] .gt{stroke:var(--accent-ink);fill:var(--surface)}
  .gtile[aria-pressed=true] span,.top-btn[aria-pressed=true] span{color:var(--accent-ink)}
  .tops{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .top-btn{padding:8px 2px 6px}
  .top-btn svg{width:30px;height:30px}
  .top-btn span{font-size:10.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis}

  /* ---------- segmented ---------- */
  .seg{display:flex;gap:2px;background:var(--fill);padding:3px;border-radius:calc(var(--r-ctl) - 2px)}
  .seg.full button{flex:1 1 0}
  .seg button{
    border:0;background:transparent;cursor:pointer;border-radius:calc(var(--r-ctl) - 5px);font-size:13px;font-weight:600;color:var(--mid);
    padding:8px 11px;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s
  }
  .seg button small{font-size:11px;font-weight:500;color:var(--soft);margin-left:4px}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .mode{padding:4px}
  .mode button{padding:10px 8px;font-size:13.5px}
  .row-2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sws{display:flex;gap:6px}

  /* ---------- toggles ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;height:34px;
    border:1px solid var(--ctl-line);background:var(--surface);border-radius:999px;padding:0 13px 0 9px;
    font-size:13px;font-weight:600;color:var(--mid);transition:all .15s
  }
  .chip i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ctl-line);display:grid;place-items:center;transition:all .15s}
  .chip i svg{width:11px;height:11px;opacity:0;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
  .chip[aria-pressed=true] i{background:var(--accent);border-color:var(--accent)}
  .chip[aria-pressed=true] i svg{opacity:1}

  /* ---------- buttons ---------- */
  .btn{
    height:44px;border-radius:var(--btn-r);border:var(--bw) solid transparent;cursor:pointer;
    font-size:14px;font-weight:700;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    transition:background .15s,border-color .15s,transform .12s,box-shadow .12s
  }
  .btn:active{transform:translateY(2px)}
  .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn--primary{background:var(--accent);color:#fff;border-color:var(--btn-bd);box-shadow:var(--btn-shadow)}
  .btn--primary:hover{background:var(--accent-hover)}
  .btn--dark{background:var(--save-bg);color:#fff;border-color:var(--btn-bd);box-shadow:var(--btn-shadow)}
  .btn--line{background:var(--surface);color:var(--ink);border-color:var(--ctl-line)}
  .btn--line:hover{border-color:var(--soft)}
  .make-row{display:flex;gap:8px;margin-top:24px}
  .make-row .btn--primary{flex:1 1 auto;height:50px;font-size:15px}
  .make-row .btn--line{width:50px;height:50px;padding:0;flex:0 0 auto}
  .btn:focus-visible,.seg button:focus-visible,.icon-btn:focus-visible,.add-btn:focus-visible,.csw:focus-visible,.ghost:focus-visible,
  .gtile:focus-visible,.chip:focus-visible,.sw:focus-visible,.top-btn:focus-visible,.tcard:focus-visible,.scard:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .spin{animation:spin .5s cubic-bezier(.34,1.6,.5,1)}
  @keyframes spin{from{transform:rotate(-180deg) scale(.7)}}

  /* ---------- empty ---------- */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:460px;padding:20px}
  .empty svg{width:90px;height:auto;margin-bottom:16px;animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  .empty p{margin:0;font-size:14.5px;font-weight:700}
  .empty .hint{margin-top:6px;font-size:12.5px;font-weight:500;color:var(--soft)}

  /* ---------- result ---------- */
  .result{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1fr);gap:24px;align-items:start}
  @media (max-width:640px){ .result{grid-template-columns:minmax(0,1fr);gap:18px} }
  .stage{
    border-radius:calc(var(--r) - 8px);padding:10px 6px 2px;background:var(--stage);cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none
  }
  .stage svg{width:100%;height:auto;max-height:62vh;margin:0 auto;overflow:visible}
  .eat{display:flex;align-items:center;gap:10px;margin-top:12px}
  .eat .btn{height:38px;font-size:13px;padding:0 13px;flex:0 0 auto}
  .eat .btn svg{width:16px;height:16px}
  .bar{flex:1 1 auto;height:6px;border-radius:99px;background:var(--line-2);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.3,.8,.4,1)}
  .eat small{font-size:12px;color:var(--soft);font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .eat-hint{margin:8px 0 0;font-size:11.5px;color:var(--soft);text-align:center}

  .eyebrow{margin:2px 0 0;font-size:12px;font-weight:600;color:var(--soft)}
  .recipe h2{margin:5px 0 0;font-family:var(--head);font-weight:var(--head-w);font-size:clamp(21px,3vw,26px);letter-spacing:var(--head-ls);line-height:1.25}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .tags span{font-size:12px;font-weight:700;color:var(--mid);background:var(--fill);border-radius:8px;padding:4px 9px}
  .note{font-size:13.5px;line-height:1.75;color:var(--mid);margin:12px 0 0}
  .box{margin-top:16px;border-radius:14px;padding:13px 15px;background:var(--fill)}
  .box-t{margin:0;font-size:12px;font-weight:700;color:var(--soft)}
  .fortune__txt{margin:5px 0 0;font-size:14.5px;font-weight:700;line-height:1.5}
  .lucky{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;font-size:12px;color:var(--mid)}
  .lucky b{color:var(--ink);font-weight:700}
  .lucky i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-left:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .sheet{margin-top:18px}
  .sheet-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
  .sheet-h h3{margin:0;font-family:var(--field-font);font-weight:var(--field-w);font-size:var(--field-size)}
  .sheet-h span{font-size:12.5px;color:var(--mid)}
  .sheet-h b{color:var(--ink);font-weight:800}
  ol.ings{list-style:none;margin:0;padding:0}
  ol.ings li{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-2)}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .ing{font-size:13.5px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .who{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap;flex:0 0 auto}
  .lead{flex:1 1 auto;min-width:8px}
  .g{font-size:12.5px;color:var(--mid);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .save-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
  .save-row > span{font-size:12.5px;font-weight:600;color:var(--mid)}
  .save-row .seg button{padding:6px 11px;font-size:12.5px}
  .acts{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;margin-top:10px}
  .acts.two{grid-template-columns:1fr 1fr}
  .acts .btn{padding:0 8px;font-size:13.5px}
  .acts .wide{grid-column:1/-1}

  /* parfait motion */
  .pf{transform-box:view-box}
  .pf.wob{animation:wob .6s cubic-bezier(.3,.7,.4,1)}
  .pf.wob-j{animation:wobj .9s cubic-bezier(.3,.7,.4,1)}
  @keyframes wob{0%{transform:none}22%{transform:scale(1.03,.955)}48%{transform:scale(.985,1.022)}72%{transform:scale(1.007,.994)}100%{transform:none}}
  @keyframes wobj{0%{transform:none}14%{transform:scale(1.06,.92) skewX(2.5deg)}32%{transform:scale(.95,1.06) skewX(-2.5deg)}50%{transform:scale(1.025,.975) skewX(1.2deg)}70%{transform:scale(.99,1.012) skewX(-.5deg)}100%{transform:none}}
  @keyframes stack{from{transform:translateY(14px) scaleY(.15);opacity:0}to{transform:none;opacity:1}}
  @keyframes pop{0%{transform:translateY(-14px) scale(.5);opacity:0}70%{transform:translateY(1px) scale(1.04);opacity:1}100%{transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .an-layer{animation:stack .45s cubic-bezier(.2,.9,.3,1.15) backwards;transform-box:fill-box;transform-origin:50% 100%}
  .an-pop{animation:pop .5s cubic-bezier(.3,.8,.4,1) backwards;transform-box:fill-box;transform-origin:50% 100%}
  .an-fade{animation:fade .5s ease backwards}

  
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:var(--surface);border-radius:12px;padding:11px 18px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:60;white-space:nowrap
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }

  /* ================= 1+2 : cafe order + studio ================= */
  :root{
    --bg:#FBF2F4; --surface:#FFFFFF; --ink:#3A2E33; --mid:#85767C; --soft:#BBADB3;
    --bd:#F0E3E7; --ctl-line:#EFE2E6; --line-2:#F6EDF0; --fill:#FBF5F6;
    --accent:#EE7FA2; --accent-hover:#E56C93; --accent-ink:#C9557C; --accent-soft:#FDEEF3;
    --r:22px; --r-ctl:14px; --btn-r:999px; --save-bg:#3A2E33;
    --mono:'Fredoka','Pretendard Variable',sans-serif; --cute:'Fredoka','Pretendard Variable',sans-serif;
  }
  body{background:var(--bg)}
  .app{max-width:1240px}
  .brand{gap:10px}
  h1{font-size:20px;letter-spacing:-.04em}
  h1::after{display:none}
  .pair{font-family:var(--mono);font-size:11px;color:var(--mid);background:#fff;border:1px solid var(--bd);border-radius:999px;padding:3px 9px}
  .layout{grid-template-columns:316px minmax(0,1fr) 320px;gap:20px;align-items:start;margin-top:22px}
  .layout > #plate{display:contents}
  .result{display:contents}
  .layout > .panel.controls{position:relative;top:auto;max-height:none;overflow:visible;border:0;border-radius:18px 18px 0 0;padding:22px 22px 28px;
    box-shadow:0 18px 40px -30px rgba(170,80,110,.45);counter-reset:fld}
  .layout > .panel.controls::after{content:'';position:absolute;left:0;right:0;bottom:-10px;height:10px;
    background:linear-gradient(-45deg,transparent 7px,#fff 7.5px) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,#fff 7.5px) 0 0/14px 10px repeat-x}
  .slip-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;margin-bottom:16px;border-bottom:1.5px dashed var(--bd)}

<script>
/* ============================================================
   1. 시드 난수 + 색 계산
   ============================================================ */
function hashStr(s){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b - a) * t;
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
const rpick = arr => arr[Math.floor(Math.random() * arr.length)];
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';

function hexToRgb(hex){
  let h = String(hex).replace('#','').trim();
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) h = 'FF9EC1';
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0, s = 0; const l = (mx + mn) / 2;
  if (d){
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s * 100, l * 100];
}
function hslToHex(h,s,l){
  h = ((h % 360) + 360) % 360; s = clamp(s,0,100)/100; l = clamp(l,0,100)/100;
  const a = s * Math.min(l, 1 - l);
  const k = n => (n + h/30) % 12;
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const t = x => Math.round(255 * x).toString(16).padStart(2,'0');
  return '#' + t(f(0)) + t(f(8)) + t(f(4));
}
function mixHue(h1, h2, t){
  const d = ((h2 - h1 + 540) % 360) - 180;
  return (h1 + d * t + 360) % 360;
}
function shade(hex, amt){
  const c = rgbToHsl.apply(null, hexToRgb(hex));
  return hslToHex(c[0], c[1], clamp(c[2] + amt, 4, 97));
}
function safeColor(c, fallback){
  return /^#[0-9a-fA-F]{6}$/.test(String(c)) ? String(c) : (fallback || '#F49AB9');
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   2. 팔레트 + 이름
   ============================================================ */
function palette(hex){
  const c = rgbToHsl.apply(null, hexToRgb(hex));
  const h = c[0], s = Math.max(c[1], 16), l = clamp(c[2], 22, 84);
  return {
    h:h, s:s, l:l, s0:c[1], source:hex,
    base:  hslToHex(h, clamp(s, 30, 88), clamp(l, 42, 68)),
    light: hslToHex(h, clamp(s * .92, 32, 80), clamp(l + 16, 58, 82)),
    pale:  hslToHex(h, clamp(s * .6, 20, 58), clamp(l + 30, 74, 90)),
    cream: hslToHex(h, clamp(s * .38, 10, 34), 94),
    deep:  hslToHex(h, clamp(s * 1.05, 34, 88), clamp(l - 18, 24, 46)),
    chip:  c[1] < 10 ? hslToHex(0, 0, clamp(l, 26, 74)) : hslToHex(h, clamp(s, 32, 88), clamp(l, 32, 72))
  };
}
const FLAVOR_BANDS = [
  [ 12, ['딸기','체리','사과','수박']],
  [ 34, ['오렌지','살구','카라멜','복숭아']],
  [ 52, ['망고','꿀','커스터드','패션후르츠']],
  [ 70, ['레몬','파인애플','유자','바나나']],
  [ 96, ['청사과','라임','키위','머스캣']],
  [140, ['멜론','말차','피스타치오','녹차']],
  [186, ['민트','소다','페퍼민트','애플민트']],
  [216, ['블루큐라소','라무네','블루라군']],
  [252, ['블루베리','블루라즈베리','아쿠아소다']],
  [286, ['라벤더','포도','타로']],
  [318, ['우베','블랙커런트','자두']],
  [361, ['라즈베리','로즈','석류','벚꽃']]
];
function flavorName(pal, rng, used){
  let list;
  if (pal.s0 < 14) list = pal.l > 62 ? ['밀크','바닐라','코코넛'] : ['흑임자','쿠키','다크초코'];
  else {
    list = ['베리'];
    for (let i = 0; i < FLAVOR_BANDS.length; i++) if (pal.h < FLAVOR_BANDS[i][0]){ list = FLAVOR_BANDS[i][1]; break; }
  }
  let f = pick(rng, list);
  if (used){
    for (let i = 0; i < 8 && used.has(f); i++) f = pick(rng, list);
    used.add(f);
  }
  return f;
}
const FRUIT_BANDS = [
  [ 18, ['딸기','체리']], [ 45, ['복숭아','오렌지']], [ 62, ['망고']], [ 82, ['파인애플','바나나']],
  [150, ['키위','청포도']], [200, ['멜론']], [262, ['블루베리']], [320, ['포도','블랙베리']], [361, ['딸기','라즈베리']]
];
function fruitName(p, rng){
  if (p.s0 < 14) return '바나나';
  for (let i = 0; i < FRUIT_BANDS.length; i++) if (p.h < FRUIT_BANDS[i][0]) return pick(rng, FRUIT_BANDS[i][1]);
  return '딸기';
}
function josa(w){
  if (!w) return '를';
  const c = w.charCodeAt(w.length - 1);
  if (c >= 0xAC00 && c <= 0xD7A3) return ((c - 0xAC00) % 28) ? '을' : '를';
  return '를';
}

/* ============================================================
   3. 재료
   ============================================================ */
const TYPE_ORDER = ['granola','cornflake','fruit','jelly','mousse','sponge','compote','pudding','sauce','soda','cream'];
const TYPE_NAME = {
  granola:'그래놀라', cornflake:'콘플레이크', fruit:'과일 슬라이스', jelly:'젤리', mousse:'무스',
  sponge:'스펀지케이크', compote:'콩포트', pudding:'푸딩', sauce:'소스', soda:'소다젤리', cream:'크림'
};
const TYPE_KO = Object.assign({}, TYPE_NAME, { fruit:'슬라이스' });
const TYPE_WEIGHT = { granola:.9, cornflake:.85, fruit:1, jelly:1, mousse:1.15, sponge:1, compote:.8, pudding:1.1, sauce:.5, soda:1, cream:.9 };
const KCAL = { granola:4.6, cornflake:3.8, fruit:.6, jelly:.7, mousse:2.4, sponge:3.1, compote:1.3, pudding:1.3, sauce:2.9, soda:.6, cream:3.3 };
const BOTTOM = ['granola','cornflake'];
const MIDDLE = ['fruit','jelly','mousse','sponge','compote','pudding','sauce','soda','cream'];

function layerColor(type, p){
  switch(type){
    case 'granola':   return hslToHex(mixHue(p.h, 28, .78), 38, 42);
    case 'cornflake': return hslToHex(mixHue(p.h, 38, .7), 52, 58);
    case 'fruit':     return hslToHex(p.h, clamp(p.s * .3, 8, 26), 93);
    case 'jelly':     return p.light;
    case 'mousse':    return p.pale;
    case 'sponge':    return hslToHex(mixHue(p.h, 40, .6), 34, 84);
    case 'compote':   return p.base;
    case 'pudding':   return hslToHex(mixHue(p.h, 42, .45), clamp(p.s * .7, 30, 62), 74);
    case 'sauce':     return p.deep;
    case 'soda':      return hslToHex(p.h, clamp(p.s * 1.1, 46, 88), clamp(p.l + 12, 56, 76));
    default:          return p.cream;
  }
}
function layerLabel(type, p, rng, used){
  if (type === 'granola')   return '구운 그래놀라';
  if (type === 'cornflake') return '콘플레이크';
  if (type === 'fruit')     return fruitName(p, rng) + ' 슬라이스';
  let f = flavorName(p, rng, used);
  if (TYPE_KO[type].indexOf(f) === 0) f = flavorName(p, rng, used);
  return f + ' ' + TYPE_KO[type];
}

  star:['별 쿠키',4], choco:['초콜릿',5], moon:['달 쿠키',3], macaron:['마카롱',12], flower:['설탕 꽃',2],
  konpeito:['별사탕',3], cookie:['초코칩 쿠키',8], leaf:['민트 잎',1], bear:['곰돌이 비스킷',6], pocky:['초코 스틱',8],

function creamFrom(pals){
  let ch = pals[0].h, cs = pals[0].s;
  for (let i = 1; i < pals.length; i++){ ch = mixHue(ch, pals[i].h, 1 / (i + 1)); cs += pals[i].s; }
  cs /= pals.length;
  return {
    color: hslToHex(ch, clamp(cs * .22, 6, 20), 97),
    shade: hslToHex(ch, clamp(cs * .36, 10, 32), 86)
  };
}

/* ---------- 이름으로 만들기 ---------- */
function buildRecipe(guests, salt, size){
  const sz = SIZES[size] || SIZES.M;
  const key = guests.map(g => g.name + '@' + g.color.toLowerCase()).join('|') + '::' + salt + '::' + size;
  const rng = mulberry32(hashStr(key));
  const pals = guests.map(g => palette(g.color));
  const n = guests.length;
  const used = new Set();

  const count = clamp(4 + Math.floor(rng() * 2) + (n - 1) + sz.bonus, 3, 8);
  const types = [pick(rng, BOTTOM)];
  let pool = MIDDLE.slice();
  for (let i = 1; i < count; i++){
    const avail = pool.filter(t => t !== types[types.length - 1]);
    const t = pick(rng, avail);
    types.push(t);
    if (pool.length > 4) pool = pool.filter(x => x !== t);
  }
  if (['sauce','granola','cornflake'].indexOf(types[types.length - 1]) > -1) types[types.length - 1] = pick(rng, ['mousse','cream','jelly']);

  const offset = Math.floor(rng() * n);
  const layers = types.map(function(type, i){
    const gi = (i + offset) % n;
    return { type, pal:pals[gi], src:guests[gi].color, who:guests[gi].name, cols:[pals[gi].chip],
             color: layerColor(type, pals[gi]), label: layerLabel(type, pals[gi], rng, used),
             weight: TYPE_WEIGHT[type] * (0.85 + rng() * 0.35) };
  });
  const budget = sz.budget + (n - 1) * 34;
  const wsum = layers.reduce((a,l) => a + l.weight, 0);
  layers.forEach(l => { l.g = Math.max(8, Math.round(l.weight / wsum * budget)); });

  const scoopG = Math.round(sz.budget * 0.21);
  const scoops = [0,1].map(function(i){
    const gi = (offset + i) % n;
    return { color: pals[gi].base, src: guests[gi].color, who: guests[gi].name, cols:[pals[gi].chip],
             label: flavorName(pals[gi], rng, used) + ' 아이스크림', g: scoopG + Math.round(rng() * 5) };
  });
  if (n === 1){ scoops[1].label = scoops[0].label; scoops[1].color = pals[0].light; }

  const cr = creamFrom(pals);
  const cream = Object.assign(cr, {
    label: n > 1 ? '섞은 생크림' : '생크림',
    who: n > 1 ? guests.map(g => g.name).join(' + ') : guests[0].name,
    cols: pals.map(p => p.chip), g: Math.round(sz.budget * 0.13) + Math.round(rng() * 5)
  });
  const fi = (offset + 1) % n;
  const fruitTop = { pal: pals[fi], src: guests[fi].color, who: guests[fi].name, cols:[pals[fi].chip],
                     label: fruitName(pals[fi], rng) + ' 슬라이스', g: 9 };

  const taken = {};
  const toppings = guests.map(function(g, i){
    let idx = hashStr(g.name + '#top') % TOPPINGS.length;
    for (let t = 0; t < TOPPINGS.length && taken[TOPPINGS[idx]]; t++) idx = (idx + 1) % TOPPINGS.length;
    const k = TOPPINGS[idx]; taken[k] = 1;
    return { kind:k, color:pals[i].base, deep:pals[i].deep, src:g.color, who:g.name, cols:[pals[i].chip], label:TOPPING_KO[k][0], g:TOPPING_KO[k][1] };
  });

  const title = n === 1 ? guests[0].name + '의 파르페' : guests.map(g => g.name).join(' × ') + ' 파르페';
  const seen = {};
  const mid = layers.slice(1,-1).map(l => l.label).filter(x => { if (seen[x]) return false; seen[x] = 1; return true; }).slice(0,2);
  const topText = toppings.map(t => t.label).join(', ');
  const note = '맨 아래 ' + layers[0].label + (mid.length ? ', 가운데 ' + mid.join(', ') : '') +
    ', 맨 위 ' + cream.label + '. 토핑으로 ' + topText + josa(topText) + ' 올렸어요.';

  return { kind:'auto', layers, scoops, cream, hasCream:true, fruitTop, toppings, title, note,
           palettes: pals, guests, servings:n, multi:n > 1, salt, sizeInfo: sz };
}

/* ---------- 직접 꾸미기 ---------- */
function defaultCustom(){
  return {
    name:'',
    layers:[ {type:'granola',color:'#F6B28C'}, {type:'fruit',color:'#F28B8B'}, {type:'mousse',color:'#F49AB9'},
             {type:'jelly',color:'#86C4EE'}, {type:'cream',color:'#EFE9E2'} ],
    scoops:['#F49AB9','#EFE9E2'], cream:true, fruit:true, fruitColor:'#F6B28C',
    tops:['cherry','cookie'], topColor:'#F28B8B'
  };
}
function buildCustom(c, size){
  const sz = SIZES[size] || SIZES.M;
  const rng = mulberry32(hashStr(JSON.stringify(c) + size));
  const used = new Set();
  const layers = c.layers.map(function(L){
    const p = palette(L.color);
    return { type:L.type, pal:p, src:L.color, who:'', cols:[p.chip], color:layerColor(L.type, p),
             label:layerLabel(L.type, p, rng, used), weight:TYPE_WEIGHT[L.type] };
  });
  const wsum = layers.reduce((a,l) => a + l.weight, 0);
  layers.forEach(l => { l.g = Math.max(8, Math.round(l.weight / wsum * sz.budget)); });
  const scoops = c.scoops.map(function(col){
    const p = palette(col);
    return { color:p.base, src:col, who:'', cols:[p.chip], label:flavorName(p, rng, used) + ' 아이스크림', g:Math.round(sz.budget * .2) };
  });
  const sp = scoops.length ? c.scoops.map(palette) : [layers[layers.length - 1].pal];
  const cream = Object.assign(creamFrom(sp), { label:'생크림', who:'', cols:[], g:Math.round(sz.budget * .13) });
  const fp = palette(c.fruitColor);
  const fruitTop = c.fruit ? { pal:fp, src:c.fruitColor, who:'', cols:[fp.chip], label:fruitName(fp, rng) + ' 슬라이스', g:9 } : null;
  const tp = palette(c.topColor);
  const toppings = c.tops.map(k => ({ kind:k, color:tp.base, deep:tp.deep, src:c.topColor, who:'', cols:[tp.chip], label:TOPPING_KO[k][0], g:TOPPING_KO[k][1] }));
  const palettes = [tp].concat(c.scoops.map(palette), layers.map(l => l.pal)).slice(0, 4);

  const title = (c.name || '').trim() || '나만의 파르페';
  const seen = {};
  const mid = layers.slice(1,-1).map(l => l.label).filter(x => { if (seen[x]) return false; seen[x] = 1; return true; }).slice(0,2);
  let note = '맨 아래 ' + layers[0].label + (mid.length ? ', 가운데 ' + mid.join(', ') : '') +
             (layers.length > 1 ? ', 맨 위 ' + layers[layers.length - 1].label : '') + '.';
  const topText = toppings.map(t => t.label).join(', ');
  let lead = '';
  if (scoops.length) lead = '위에 아이스크림 ' + scoops.length + '스쿱' + (c.cream ? '과 생크림을' : '을');
  else if (c.cream) lead = '위에 생크림을';
  if (lead) note += ' ' + lead + (toppings.length ? ' 얹고 토핑으로 ' + topText + josa(topText) + ' 올렸어요.' : ' 얹었어요.');
  else if (toppings.length) note += ' 토핑으로 ' + topText + josa(topText) + ' 올렸어요.';

  return { kind:'custom', layers, scoops, cream, hasCream:!!c.cream, fruitTop, toppings, title, note,
           palettes, guests:[], servings:1, multi:false, salt:0, sizeInfo: sz };
}

/* ============================================================
   4. 소리 (와작와작)
   ============================================================ */
let soundOn = true;
const Sound = (function(){
  let ctx = null, nb = null, out = null;
  function get(){
    if (!soundOn) return null;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    if (!ctx){ ctx = new C(); out = ctx.createGain(); out.gain.value = .8; out.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function buf(a){
    if (!nb){
      nb = a.createBuffer(1, Math.floor(a.sampleRate * .6), a.sampleRate);
      const d = nb.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return nb;
  }
  function noise(a, t, o){
    o = Object.assign({ f:2500, q:1, dur:.06, gain:.4, type:'bandpass' }, o);
    const s = a.createBufferSource(); s.buffer = buf(a);
    const fl = a.createBiquadFilter(); fl.type = o.type; fl.frequency.value = o.f; fl.Q.value = o.q;
    const g = a.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(o.gain, t + .004);
    g.gain.exponentialRampToValueAtTime(.0001, t + o.dur);
    s.connect(fl); fl.connect(g); g.connect(out);
    s.start(t, Math.random() * .45); s.stop(t + o.dur + .03);
  }
  function tone(a, t, f1, f2, dur, gain, type){
    const o = a.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + dur + .03);
  }
  return {
    unlock(){ get(); },
    crunch(){
      const a = get(); if (!a) return;
      const t = a.currentTime + .01;
      [0, .09, .19, .3].forEach(function(o, i){
        const v = 1 - i * .13, j = Math.random() * .02;
        noise(a, t + o + j, { f:1500 + Math.random() * 2200, q:.8, dur:.045 + Math.random() * .04, gain:.55 * v });
        noise(a, t + o + j + .012, { f:3800 + Math.random() * 1600, q:1.6, dur:.03, gain:.22 * v });
        noise(a, t + o + j, { type:'lowpass', f:380, q:.6, dur:.08, gain:.42 * v });
      });
    },
    soft(){
      const a = get(); if (!a) return;
      const t = a.currentTime + .01;
      [0, .18].forEach(function(o, i){
        tone(a, t + o, 560 - i * 70, 290, .13, .13, 'sine');
        noise(a, t + o, { type:'lowpass', f:800, q:.5, dur:.12, gain:.2 });
      });
    },
    jiggle(){
      const a = get(); if (!a) return;
      const t = a.currentTime + .01;
      tone(a, t, 210, 560, .15, .16, 'triangle');
      tone(a, t + .14, 540, 300, .2, .12, 'sine');
      noise(a, t, { type:'lowpass', f:600, q:2, dur:.15, gain:.14 });
    },
    stack(n){
      const a = get(); if (!a) return;
      const t = a.currentTime + .12;
      for (let i = 0; i < n; i++) tone(a, t + i * .09, 360 + i * 55, 620 + i * 70, .07, .1, 'sine');
      tone(a, t + n * .09 + .14, 520, 260, .12, .11, 'sine');
      for (let k = 0; k < 3; k++) tone(a, t + n * .09 + .42 + k * .075, 880 * Math.pow(1.19, k), 900 * Math.pow(1.19, k), .12, .06, 'triangle');
    },
    done(){
      const a = get(); if (!a) return;
      const t = a.currentTime + .05;
      [523, 659, 784, 1047].forEach((f, i) => tone(a, t + i * .085, f, f * 1.01, .2, .08, 'triangle'));
    },
    tick(){
      const a = get(); if (!a) return;
      tone(a, a.currentTime + .005, 1100, 760, .045, .05, 'sine');
    }
  };
})();

function wavy(yTop, yBottom, amp, freq, phase){
  let d = 'M-6,' + yBottom.toFixed(1) + ' L-6,' + yTop.toFixed(1);
  for (let x = -6; x <= 326; x += 8) d += ' L' + x + ',' + (yTop + Math.sin((x / 320) * Math.PI * 2 * freq + phase) * amp).toFixed(1);
  return d + ' L326,' + yBottom.toFixed(1) + ' Z';
}
/* 먹은 자리 — 숟가락 자국 모양으로 깎인 경계 */
function biteEdge(y, seed){
  const r = mulberry32(seed);
  let d = 'M-60,1400 L-60,' + y.toFixed(1), x = -60;
  while (x < 380){
    const w = 30 + r() * 14, dip = 8 + r() * 7;
    d += ' Q' + (x + w / 2).toFixed(1) + ',' + (y + dip * 2).toFixed(1) + ' ' + (x + w).toFixed(1) + ',' + y.toFixed(1);
    x += w;
  }
  return d + ' L380,1400 Z';
}

function slice(x, y, R, p, rng){
  let s = '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + R.toFixed(1) + '" fill="' + p.base + '"/>' +
          '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (R * .78).toFixed(1) + '" fill="' + p.light + '"/>' +
          '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (R * .26).toFixed(1) + '" fill="' + p.pale + '"/>';
  const a0 = rng() * 6.28;
  for (let k = 0; k < 6; k++){
    const a = a0 + k * Math.PI / 3, sx = x + Math.cos(a) * R * .52, sy = y + Math.sin(a) * R * .52;
    s += '<ellipse cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" rx="' + (R * .07 + .6).toFixed(1) + '" ry="' + (R * .11 + .8).toFixed(1) +
         '" fill="' + p.deep + '" fill-opacity="0.55" transform="rotate(' + (a * 57.3 + 90).toFixed(0) + ' ' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ')"/>';
  }
  return s;
}

function texture(type, top, bottom, color, rng, p){
  const dark = shade(color, -16), lite = shade(color, 22);
  const mid = (top + bottom) / 2;

function scallopPath(cx, cy, R, n, amp){
  let d = '';

    const a0 = k * 2 * Math.PI / n, a1 = (k + 1) * 2 * Math.PI / n, am = (a0 + a1) / 2;

    d += ' Q' + (cx + Math.cos(am) * (R + amp)).toFixed(2) + ',' + (cy + Math.sin(am) * (R + amp)).toFixed(2) + ' ' + (cx + Math.cos(a1) * R).toFixed(2) + ',' + (cy + Math.sin(a1) * R).toFixed(2);
  }
  return d + 'Z';
}

const DECO_DEFAULT = { straw:true, wafer:true, sprinkle:true };

function buildSVG(r, animate, gk, dc){
  dc = dc || DECO_DEFAULT;
  const G = GLASSES[gk] || GLASSES.tall;
  const uid = 'u' + Math.floor(Math.random() * 1e8);
  const rng = mulberry32(hashStr(r.title + r.note + r.salt + gk));
  const RIM = G.rim, BOT = G.bottom, HW = G.halfW;
  const nS = r.scoops.length, hasS = nS > 0, hasC = r.hasCream;
  const A = (cls, delay) => animate ? ' class="' + cls + '" style="animation-delay:' + delay + 'ms"' : '';
  const sb = !hasS ? RIM - 24 : (nS >= 3 ? RIM - 64 : RIM - 50);
  let crownTop = hasC ? sb - 112 : hasS ? RIM - (nS >= 3 ? 116 : 104) : RIM - 40;
  if (r.fruitTop) crownTop = Math.min(crownTop, RIM - 100);
  if (dc.wafer) crownTop = Math.min(crownTop, RIM - 160);
  if (!r.toppings.length && !dc.wafer) crownTop += 20;

  let o = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + VW + ' ' + VH + '" role="img" aria-label="' + esc(r.title) + '">';
  o += '<defs><clipPath id="' + uid + 'b"><path d="' + G.bowl + '"/></clipPath>' +
       '<clipPath id="' + uid + 'e"><path class="eat-p" d="' + biteEdge(-400, 1) + '"/></clipPath>' +
       '<linearGradient id="' + uid + 'g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.42"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.06"/>' +
       '<stop offset="0.75" stop-color="#fff" stop-opacity="0.02"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></linearGradient>' +
       '<radialGradient id="' + uid + 'c" cx="0.36" cy="0.3" r="0.9"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="' + r.cream.color + '"/><stop offset="1" stop-color="' + r.cream.shade + '"/></radialGradient>' +
       '<radialGradient id="' + uid + 'gl" cx="0.3" cy="0.22" r="0.6"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>' +
       '<linearGradient id="' + uid + 'sd" x1="0" y1="0" x2="0" y2="1"><stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.12"/></linearGradient>' +
       '<linearGradient id="' + uid + 'v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.12"/><stop offset="0.7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.06"/></linearGradient></defs>';

  o += '<g class="pf" style="transform-origin:160px ' + G.shadow[1] + 'px">';
  o += '<ellipse cx="' + G.shadow[0] + '" cy="' + G.shadow[1] + '" rx="' + G.shadow[2] + '" ry="' + G.shadow[3] + '" fill="#2B2629" fill-opacity="0.08"/>';

  const total = r.layers.reduce((a,l) => a + l.weight, 0);
  const span = BOT - RIM - 6;
  let cur = BOT;
  const bands = r.layers.map(function(l, i){
    const h = (l.weight / total) * span;
    const top = (i === r.layers.length - 1) ? RIM - 4 : cur - h;
    const b = { l, top, bottom:cur };
    cur = top;
    return b;
  });
  const eatOpen = '<g clip-path="url(#' + uid + 'e)">';
  o += eatOpen + '<g clip-path="url(#' + uid + 'b)">';
  bands.forEach(function(b, i){
    const amp = i === bands.length-1 ? 1.5 : 2.4, fq = 1.2 + rng(), ph = rng()*6.28;
    let hl = '';
    if (b.bottom - b.top > 10){
      for (let x = -6; x <= 326; x += 8) hl += (x === -6 ? 'M' : ' L') + x + ',' + (b.top + 3.2 + Math.sin((x / 320) * Math.PI * 2 * fq + ph) * amp).toFixed(1);
    }
    o += '<g' + A('an-layer', i * 90) + '><path d="' + wavy(b.top, b.bottom + 6, amp, fq, ph) + '" fill="' + b.l.color + '"/>' +
         texture(b.l.type, b.top, b.bottom, b.l.color, rng, b.l.pal) +
         (hl ? '<path d="' + hl + '" stroke="#fff" stroke-opacity="0.42" stroke-width="2.2" fill="none" stroke-linecap="round"/>' : '') + '</g>';
  });
  o += '</g></g><path d="' + G.bowl + '" fill="url(#' + uid + 'v)"/><path d="' + G.bowl + '" fill="url(#' + uid + 'g)"/>';

  const d0 = animate ? r.layers.length * 90 : 0;
  if (dc.straw) o += '<g' + A('an-fade', d0 + 40) + '>' + straw(RIM, r.palettes[r.palettes.length - 1].base) + '</g>';

  o += eatOpen;
  if (dc.wafer) o += '<g' + A('an-fade', d0 + 60) + '>' + wafer(120, hasS ? RIM - 40 : hasC ? RIM - 8 : RIM + 40) + '</g>';
  if (r.fruitTop) o += '<g' + A('an-pop', d0 + 80) + '>' + (hasS ? fruitDisc(211, RIM - 72, 24, r.fruitTop.pal) : fruitDisc(206, RIM - 24, 22, r.fruitTop.pal)) + '</g>';

  const SP = nS === 1 ? [[160, RIM - 30, 42]] : nS === 2 ? [[121, RIM - 30, 40],[199, RIM - 30, 40]] : nS >= 3 ? [[114, RIM - 26, 36],[206, RIM - 26, 36],[160, RIM - 42, 38]] : [];
  r.scoops.slice(0, 3).forEach(function(s, i){
    const p = SP[i];
    o += '<g' + A('an-pop', d0 + 120 + i * 90) + '><g class="mal" style="animation-delay:' + (-i * 1.1).toFixed(1) + 's">' + scoop(p[0], p[1], p[2], s.color, uid) + '</g></g>';
  });

  if (hasC){
    const nR = Math.max(5, Math.round((2 * (HW - 8)) / 23) + 1);
    const rr = clamp((2 * (HW - 8)) / (nR - 1) * .9, 14, 22);
    let ro = '<g' + A('an-pop', d0 + 220) + '>';
    for (let i = 0; i < nR; i++){
      const x = 160 - (HW - 8) + i * (2 * (HW - 8)) / (nR - 1);
      ro += rosette(x, RIM + 3 - (i % 2) * 3, rr, 'url(#' + uid + 'c)', r.cream.shade);
    }
    o += ro + '</g>';
    let cw = '<g' + A('an-pop', d0 + 300) + '><g class="mal" style="animation-delay:-.6s">';
    [[38,14,0],[32,13,2],[26,12,-2],[19,10,1],[12,8,0]].forEach(function(t, i){
      const y = sb - i * 13, cx = 160 + t[2];
      cw += '<ellipse cx="' + cx + '" cy="' + y + '" rx="' + t[0] + '" ry="' + t[1] + '" fill="url(#' + uid + 'c)" stroke="' + r.cream.shade + '" stroke-opacity="0.35" stroke-width="1.2"/>' +
            '<path d="M' + (cx - t[0] * .86).toFixed(1) + ',' + (y + t[1] * .25).toFixed(1) + ' a' + t[0] + ',' + t[1] + ' 0 0 0 ' + (t[0] * 1.72).toFixed(1) +
            ',0" fill="none" stroke="' + r.cream.shade + '" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>';
    });
    cw += '<path d="M154,' + (sb - 54) + ' Q159,' + (sb - 74) + ' 170,' + (sb - 63) + ' Q165,' + (sb - 58) + ' 165,' + (sb - 53) +
          ' Z" fill="url(#' + uid + 'c)" stroke="' + r.cream.shade + '" stroke-opacity="0.35" stroke-width="1.2"/></g></g>';
    o += cw;
  }

  if (dc.sprinkle){
    let sp = '<g' + A('an-fade', d0 + 420) + '>';
    for (let i = 0; i < 16; i++){
      let x, y;
      if (hasC){
        if (i < 8){ x = 160 + (rng() - .5) * 52; y = sb - 6 - rng() * 44; }
        else { x = 160 + (i % 2 ? 1 : -1) * (46 + rng() * 22); y = (hasS ? RIM - 50 : RIM - 8) - rng() * 16; }
      } else if (hasS){ const p = SP[i % SP.length]; x = p[0] + (rng() - .5) * p[2] * 1.2; y = p[1] - p[2] * (.45 + rng() * .4); }
      else { x = 160 + (rng() - .5) * HW * 1.6; y = RIM - 3 - rng() * 4; }
      const pc = r.palettes[i % r.palettes.length];
      sp += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="5" height="2.2" rx="1.1" fill="' + (i % 3 ? pc.deep : pc.light) +
            '" transform="rotate(' + (rng() * 180).toFixed(0) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"/>';
    }
    o += sp + '</g>';
  }

  const SLOTS = hasC && hasS ? [[160, sb - 78, 1.15],[110, RIM - 74, .95],[207, RIM - 42, .85],[193, sb - 46, .8],[127, sb - 46, .8]]
              : hasC ? [[160, sb - 78, 1.1],[112, RIM - 18, .9],[208, RIM - 18, .9],[90, RIM - 12, .8],[230, RIM - 12, .8]]
              : hasS ? [[160, RIM - (nS >= 3 ? 84 : 72), 1.1],[118, RIM - 62, .95],[202, RIM - 62, .95],[140, RIM - 48, .85],[180, RIM - 48, .85]]
              : [[160, RIM - 12, 1],[124, RIM - 10, .9],[196, RIM - 10, .9],[100, RIM - 6, .85],[220, RIM - 6, .85]];
  r.toppings.slice(0, 5).forEach(function(t, i){
    const s = SLOTS[i];
    o += '<g' + A('an-pop', d0 + 460 + i * 100) + '><g class="bob" style="animation-delay:' + (-i * .7).toFixed(1) + 's">' + topping(t.kind, s[0], s[1], t.color, t.deep, s[2] * 1.15) + '</g></g>';
  });
  o += '</g>';

  o += '<g' + (animate ? ' class="an-fade"' : '') + '>';
  if (G.stem) o += '<path d="' + G.stem + '" fill="#fff" fill-opacity="0.45"/>';
  o += '<path d="' + G.foot + '" fill="#fff" fill-opacity="0.5"/>';
  if (G.footEl) o += '<ellipse cx="' + G.footEl[0] + '" cy="' + G.footEl[1] + '" rx="' + G.footEl[2] + '" ry="' + G.footEl[3] + '" fill="#fff" fill-opacity="0.4"/>';
  o += '<g fill="none" stroke="#2B2629" stroke-opacity="0.13" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="' + G.bowl + '"/>' +
       (G.stem ? '<path d="' + G.stem + '"/>' : '') + '<path d="' + G.foot + '"/></g>';
  o += '<path d="' + G.hi1 + '" stroke="#fff" stroke-opacity="0.7" stroke-width="5" fill="none" stroke-linecap="round"/>';
  o += '<path d="' + G.hi2 + '" stroke="#fff" stroke-opacity="0.38" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  const twinkle = (x, y, k) => '<path transform="translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ') scale(' + k + ')" fill="#fff" d="M0,-6 C.6,-1.6 1.6,-.6 6,0 C1.6,.6 .6,1.6 0,6 C-.6,1.6 -1.6,.6 -6,0 C-1.6,-.6 -.6,-1.6 0,-6 Z"/>';
  o += twinkle(160 - HW + 22, RIM + 26, 1.15) + twinkle(160 - HW + 32, RIM + 40, .55) + twinkle(160 + HW - 24, RIM + (BOT - RIM) * .64, .8);
  o += '</g><g class="crumbs"></g></g>' + SPOON + '</svg>';

  svgMeta = {
    top: crownTop, bot: BOT + 4, rim: RIM, sb, hasC, hasS, wafer: !!dc.wafer,
    bands: bands.map(b => ({ top:b.top, bottom:b.bottom, color:b.l.color, type:b.l.type })),
    topColors: r.toppings.map(t => t.color), topCrunchy: !!(r.toppings[0] && CRUNCHY[r.toppings[0].kind]),
    scoopColors: r.scoops.map(s => s.color), cream: r.cream.color, creamShade: r.cream.shade
  };
  return o;
}

function whoChip(name, cols){
  const raw = ((cols && cols.length) ? cols : ['#F49AB9']).map(x => safeColor(x));
  const bgs = raw.map(function(x){ const c = rgbToHsl.apply(null, hexToRgb(x)); return hslToHex(c[0], clamp(c[1] * .7, 0, 70), 91); });
  const bg = bgs.length > 1 ? 'linear-gradient(100deg,' + bgs.map((x, i) => x + ' ' + Math.round(i / (bgs.length - 1) * 100) + '%').join(',') + ')' : bgs[0];
  return '<span class="who" style="background:' + bg + ';color:#2B2629">' + esc(name) + '</span>';
}

function openPop(anchor, cur, cb){
  if (popAnchor === anchor && !$pop.hidden){ closePop(); return; }

  $popColor.value = safeColor(cur);
  markSwatch();
  $pop.hidden = false;

  $pop.style.left = (clamp(r.left - 6, 8, vw - pw - 8) + window.scrollX) + 'px';

}

function pickColor(c){
  popCur = c; markSwatch();
  if (popAnchor) popAnchor.style.setProperty('--c', c);
  if (popCb) popCb(c);
}

const GLASS_EDGE = { tall:[178, 368, 74, 112], cup:[162, 390, 78, 102], bowl:[208, 328, 54, 114], jar:[170, 396, 86, 86] };
const SHORT = { granola:'그래놀라', cornflake:'콘플레이크', fruit:'과일', jelly:'젤리', mousse:'무스', sponge:'스펀지', compote:'콩포트', pudding:'푸딩', sauce:'소스', soda:'소다젤리', cream:'크림' };
function layerNotes(r){
  const M = svgMeta, n = M.bands.length;
  const pickI = n <= 4 ? M.bands.map((b, i) => i) : [0, Math.round(n * .35), Math.round(n * .65), n - 1];
  return pickI.map(function(i, k){
    const b = M.bands[i], yy = (b.top + b.bottom) / 2, y = yy / VH * 100, l = r.layers[i];
    const E = GLASS_EDGE[glassKey] || GLASS_EDGE.tall, t = clamp((yy - E[0]) / (E[1] - E[0]), 0, 1);
    const xl = lerp(E[2], E[3], t) - 6, side = k % 2 ? 'r' : 'l';
    const pos = side === 'l' ? 'right:' + ((VW - xl) / VW * 100).toFixed(1) + '%' : 'left:' + ((VW - xl) / VW * 100).toFixed(1) + '%';
    return '<span class="nt ' + side + '" style="top:' + y.toFixed(1) + '%;' + pos + '"><span><b>' + SHORT[l.type] + '</b>' + (l.who ? '<small>' + esc(l.who) + '</small>' : '') + '</span></span>';
  }).join('');
}

/* ---------- 한 입씩 먹기 ---------- */
function updateEat(){
  const total = biteTotal(), left = total - bites;
  const btn = $('bite');
  if (!btn) return;
  btn.innerHTML = left <= 0 ? ICON.refill + 'Refill' : ICON.spoon + 'Take a Bite';
  $('barFill').style.width = (left / total * 100) + '%';
  $('biteN').textContent = left + '/' + total;
}
function biteInfo(M, from, to){
  const mid = (from + to) / 2;
  if (mid <= M.rim){
    if (M.hasC && mid < M.sb - 58) return { kind: M.topCrunchy ? 'crunch' : 'soft', colors: M.topColors.concat([M.cream, M.cream]) };
    if (!M.hasC && !M.hasS) return { kind: M.topCrunchy ? 'crunch' : 'soft', colors: M.topColors.concat(['#EFD3A3']) };
    if (M.wafer && mid < M.rim - 40) return { kind:'crunch', colors:['#EFD3A3', '#D7AE70', M.cream].concat(M.scoopColors) };
    return { kind:'soft', colors: M.scoopColors.concat(M.hasC ? [M.cream, M.creamShade] : []).concat(M.topColors).slice(0, 5) };
  }
  const hit = M.bands.filter(b => b.bottom > from && b.top < to + 4);
  const types = hit.map(b => b.type);
  const kind = types.some(t => t === 'granola' || t === 'cornflake') ? 'crunch'
             : types.some(t => t === 'jelly' || t === 'soda' || t === 'pudding') ? 'jiggle' : 'soft';
  const colors = hit.map(b => b.color).concat(hit.map(b => shade(b.color, -12)));
  return { kind, colors: colors.length ? colors : [M.cream] };
}
function crumbs(svg, cx, y, info){
  const g = svg.querySelector('.crumbs');
  if (!g) return;
  const crunchy = info.kind === 'crunch', n = crunchy ? 16 : 10, ps = [];
  for (let i = 0; i < n; i++){
    const el = document.createElementNS(NS, crunchy ? 'rect' : 'circle');
    const sz = 1.6 + Math.random() * 2.4;
    if (crunchy){ el.setAttribute('width', (sz * 1.9).toFixed(1)); el.setAttribute('height', (sz * 1.3).toFixed(1)); el.setAttribute('rx', '.8'); }
    else el.setAttribute('r', sz.toFixed(1));
    el.setAttribute('fill', info.colors[i % info.colors.length]);
    g.appendChild(el);
    ps.push({ el, x: cx + (Math.random() - .5) * 64, y: y, vx: (Math.random() - .5) * 3.6, vy: -(1.6 + Math.random() * 3.4),
              rot: Math.random() * 360, vr: (Math.random() - .5) * 22, crunchy });
  }
  const t0 = performance.now(); let last = t0;
  (function f(now){
    const dt = Math.min(2.5, (now - last) / 16.7); last = now;
    const life = (now - t0) / 720;
    ps.forEach(function(p){
      p.vy += .32 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.crunchy){ p.el.setAttribute('x', p.x.toFixed(1)); p.el.setAttribute('y', p.y.toFixed(1)); p.el.setAttribute('transform', 'rotate(' + p.rot.toFixed(0) + ' ' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')'); }
      else { p.el.setAttribute('cx', p.x.toFixed(1)); p.el.setAttribute('cy', p.y.toFixed(1)); }
      p.el.setAttribute('opacity', Math.max(0, 1 - life * life).toFixed(2));
    });
    if (life < 1) requestAnimationFrame(f); else ps.forEach(p => p.el.remove());
  })(t0);
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeIn = t => t * t * t;
const easeBack = t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function eat(){
  if (!current) return;
  Sound.unlock();
  const total = biteTotal();
  if (bites >= total){
    if (eating) return;
    render(true); Sound.stack(current.layers.length);
    return;
  }
  if (eating){ queued = Math.min(queued + 1, 2); return; }
  const svg = document.querySelector('#stage svg');
  const M = svgMeta;
  if (!svg || !M) return;
  eating = true; bites++; updateEat();
  const path = svg.querySelector('.eat-p'), spoon = svg.querySelector('.spoon'), blob = svg.querySelector('.spoon-blob'),
        food = svg.querySelector('.spoon-food'), pf = svg.querySelector('.pf');
  const from = eatY == null ? M.top : eatY;
  const to = bites >= total ? M.bot + 40 : M.top + (M.bot - M.top) * bites / total;
  const info = biteInfo(M, from, Math.min(to, M.bot));
  food.setAttribute('fill', info.colors[0]);
  const seed = bites * 977 + 13;
  const cx = 150 + (Math.random() - .5) * 36;
  const yS = Math.min(to, M.bot - 14);
  const finish = function(){
    eatY = to; eating = false;
    if (bites >= total){ setTimeout(function(){ Sound.done(); toast('다 먹었어요'); }, 120); }
    else if (queued > 0){ queued--; eat(); }
  };
  if (reduceMotion()){
    path.setAttribute('d', biteEdge(to, seed));
    Sound[info.kind]();
    finish();
    return;
  }
  const T = 980, t0 = performance.now();
  let fired = false;
  (function frame(now){
    const t = Math.min(1, (now - t0) / T);
    const c = clamp((t - .28) / .36, 0, 1);
    path.setAttribute('d', biteEdge(from + (to - from) * easeBack(c), seed));
    let sx, sy, rot, op = 1, bs = 0;
    if (t < .28){
      const k = easeOut(t / .28);
      sx = lerp(330, cx + 12, k); sy = lerp(yS - 130, yS + 4, k); rot = lerp(34, -4, k); op = Math.min(1, t / .1);
    } else if (t < .62){
      const k = easeInOut((t - .28) / .34);
      sx = lerp(cx + 12, cx - 20, k); sy = lerp(yS + 4, yS - 18, k) + Math.sin(k * Math.PI) * 6; rot = lerp(-4, -38, k); bs = easeBack(clamp(k * 1.3, 0, 1));
    } else {
      const k = easeIn((t - .62) / .38);
      sx = lerp(cx - 20, 340, k); sy = lerp(yS - 18, yS - 170, k); rot = lerp(-38, 14, k); bs = 1; op = t > .88 ? 1 - (t - .88) / .12 : 1;
    }
    spoon.setAttribute('transform', 'translate(' + sx.toFixed(1) + ',' + sy.toFixed(1) + ') rotate(' + rot.toFixed(1) + ')');
    spoon.setAttribute('opacity', op.toFixed(2));
    blob.setAttribute('transform', 'scale(' + bs.toFixed(3) + ')');
    if (!fired && t >= .3){
      fired = true;
      Sound[info.kind]();
      crumbs(svg, cx, Math.min(to, M.bot - 8), info);
      pf.classList.remove('wob', 'wob-j'); void pf.getBoundingClientRect();
      pf.classList.add(info.kind === 'jiggle' ? 'wob-j' : 'wob');
    }
    if (t < 1) requestAnimationFrame(frame); else finish();
  })(t0);
}

/* ============================================================
   9. 공유 링크
   ============================================================ */
function decoBits(){ return DECO_KEYS.map(d => deco[d[0]] ? '1' : '0').join(''); }
function b64(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function writeHash(){
  let h = '#';
  if (mode === 'custom') h += 'c=' + b64(JSON.stringify(custom));
  else h += 'g=' + guests.map(x => encodeURIComponent(x.name) + '~' + safeColor(x.color).replace('#','')).join('!') + '&s=' + salt;
  h += '&v=' + glassKey + '&z=' + sizeKey + '&d=' + decoBits();
  history.replaceState(null, '', location.pathname + location.search + h);
}
function cleanCustom(o){
  const okC = c => safeColor(c, '#F49AB9');
  if (!o || !Array.isArray(o.layers) || !o.layers.length) return null;
  return {
    name: String(o.name || '').slice(0, 20),
    layers: o.layers.slice(0, 8).map(l => ({ type: TYPE_NAME[l && l.type] ? l.type : 'mousse', color: okC(l && l.color) })),
    scoops: (Array.isArray(o.scoops) ? o.scoops : []).slice(0, 3).map(okC),
    cream: !!o.cream, fruit: !!o.fruit, fruitColor: okC(o.fruitColor),
    tops: (Array.isArray(o.tops) ? o.tops : []).filter(k => TOPPING_KO[k]).slice(0, 5), topColor: okC(o.topColor)
  };
}
function readHash(){
  const h = location.hash.slice(1);
  if (!h) return false;
  const q = {};
  h.split('&').forEach(function(p){ const i = p.indexOf('='); if (i > 0) q[p.slice(0,i)] = p.slice(i+1); });
  if (GLASSES[q.v]) glassKey = q.v;
  if (SIZES[q.z]) sizeKey = q.z;
  if (q.d && /^[01]+$/.test(q.d)) DECO_KEYS.forEach(function(d, i){ if (q.d[i]) deco[d[0]] = q.d[i] === '1'; });
  if (q.c){
    try { const c = cleanCustom(JSON.parse(unb64(q.c))); if (c){ custom = c; mode = 'custom'; return true; } } catch(e){}
    return false;
  }
  if (!q.g) return false;
  let list;
  try {
    list = q.g.split('!').map(function(p){
      const bits = p.split('~');
      return { name: decodeURIComponent(bits[0] || '').slice(0,20), color: safeColor('#' + (bits[1] || '').slice(0,6)) };
    }).slice(0,4);
  } catch(e){ return false; }
  if (!list.length) return false;
  guests = list;
  salt = parseInt(q.s, 10) || 0;
  return true;
}
function copyLink(){
  writeHash();
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(() => toast('링크를 복사했어요'), () => toast('주소창의 링크를 복사해 주세요'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('링크를 복사했어요'); } catch(e){ toast('주소창의 링크를 복사해 주세요'); }
    document.body.removeChild(ta);
  }
}

/* 귀여운 레시피 카드로 저장 */
function savePNG(){

}
const CV = { ink:'#3A2E33', mid:'#85767C', soft:'#BBADB3', line:'#EADCE1', pink:'#EE7FA2', pinkSoft:'#FDEEF3', bg:'#FBF2F4', mint:'#9FD8C1', butter:'#F6D27E',
  sans:"'Pretendard Variable', Pretendard, sans-serif", mono:"'Fredoka', 'Pretendard Variable', sans-serif" };
function cvNew(w, h, s){
  const cv = document.createElement('canvas'); cv.width = w * s; cv.height = h * s;
  const x = cv.getContext('2d'); x.scale(s, s); x.textBaseline = 'alphabetic';
  return [cv, x];
}
function rr(x, l, t, w, h, r){ x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r); x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath(); }
function cvLogo(x, l, t, k){
  [['#F29BB7', 0], ['#9FD8C1', 9.3], ['#F6D27E', 18.6]].forEach(function(b){ x.fillStyle = b[0]; rr(x, l, t + b[1] * k, 28 * k, 7.4 * k, 3.7 * k); x.fill(); });
}
function cvDash(x, l, r, y, col, dash){ x.save(); x.strokeStyle = col || CV.line; x.lineWidth = 1.5; x.setLineDash(dash || [5, 4]); x.beginPath(); x.moveTo(l, y); x.lineTo(r, y); x.stroke(); x.restore(); }
function cvText(x, t, px, py, font, col, align){ x.font = font; x.fillStyle = col; x.textAlign = align || 'left'; x.fillText(t, px, py); }
function cvSpaced(x, t, cx, y, font, col, sp){
  x.font = font; x.fillStyle = col; x.textAlign = 'left';
  const w = [...t].reduce((a, ch) => a + x.measureText(ch).width + sp, -sp);
  let px = cx - w / 2;
  [...t].forEach(ch => { x.fillText(ch, px, y); px += x.measureText(ch).width + sp; });
}
function cvWrap(x, t, maxW){
  const out = []; let line = '';
  [...t].forEach(function(ch){ const test = line + ch; if (x.measureText(test).width > maxW && line){ out.push(line); line = ch; } else line = test; });
  if (line) out.push(line);
  return out;
}
function cvPlate(x, cx, cy, R){
  x.fillStyle = '#FFF3F6'; x.beginPath(); x.arc(cx, cy, R * 1.12, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#FCE7EE'; x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.fill();
}
function cvScallopEdge(x, l, r, y, dir, col){

}
function cvBarcode(x, cx, y, w, h, seed){

}
function drawRecipeCard(img){
  const r = current, W = 380, M = 22, CW = W - M * 2, L = M + 22, R = W - M - 22;
